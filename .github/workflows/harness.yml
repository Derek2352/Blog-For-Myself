# The browser fleet — the checks that need a real page, not a module.
#
# `ci.yml` type-checks, runs the unit suite and builds. None of that can see the things this site is
# actually made of: whether the cat looks at the pointer, whether a drawn cover sinks into the dark
# theme, whether filtering the timeline orphans a year marker, whether the card game leaves the page
# exactly as it found it. Those are measured by 38 harnesses in `scratchpad/`, and until this file
# existed **not one of them ran anywhere but on somebody's laptop**.
#
# ## Why a separate workflow
#
# Because it is slow. A full pass is a build plus about twelve minutes of browser time, and a gate
# that slow on every push is a gate people route around. `ci.yml` stays fast and stays required; this
# runs nightly and on demand. Add `push: branches: [main]` here if you would rather have it on every
# merge — it is one line, and the only reason it is not already there is the minute cost.
#
# ## Why only eleven of the thirty-eight
#
# Because these eleven are the ones **measured green on this repository**, timed: art-sink 16/16
# (12s), gaze 14/14 (25s), timeline-filter 35/35 (4s), arena5 22/22 (114s), arena8 27/27 (148s),
# first-run (39s), rail-spy 10/10 (3s), card-check 21/21 (7s), phone-audit 3/3 (~35s), arena 55/55
# (~200s), arena4 39/39 (~150s).
#
# Those are laptop figures. Run 5 of this workflow gives the runner's, which are what the two
# timeouts below have to cover, and they are the same within noise: art-sink 16s, gaze 25s,
# timeline-filter 3s, rail-spy 3s, card-check 7s, phone-audit 6s, first-run 31s, arena5 112s,
# arena8 133s — 336s for the nine. arena and arena4 should add about 350s, so expect the fleet step
# to take twelve minutes or so. `timeout 420` per harness is roughly double the longest; the job's
# 40 minutes is the backstop for several of them hanging at once rather than a figure the normal
# run comes near.
#
# `phone-audit` joined with the mobile pass. It drives a 390×844 touch profile over nine pages and
# checks the three things that actually break a phone: horizontal overflow, tap target size against
# WCAG 2.5.8 AA, and prose under 12px. Proved able to fail the way the others were — delete the
# `.footer-nav a` rule from the built CSS and it goes red naming the four footer links.
#
# The rest are excluded on purpose, and there are three reasons, all of them recorded rather than
# guessed:
#
#   - ~~**`arena`, `arena4`**~~ — **in, as of the snapshot fix.** They were excluded because three
#     of arena's checks failed about four runs in five on a positional DOM snapshot that reported one
#     inserted element as 245 differences. Two things changed: `prefetch={false}` (done for mobile
#     payload) removed the background page fetches that were racing the baseline, and `snapDiff` now
#     aligns the two snapshots instead of zipping them. Measured 5/5 green each before the instrument
#     fix and 3/3 after — arena 55/55 (~200s), arena4 39/39 (~150s). The history is at the top of
#     `scratchpad/arena.mjs`; `tests/snap-diff.test.ts` fails if the positional compare returns.
#   - **`parity`** — obsolete. It compares against the Astro build, which no longer exists.
#   - **`plate-sink`, `plate-hues`, `plate-look`, `page-audit`, `crop`, `measure`, `fixed-in-shot`** —
#     these report a fixture or write screenshots for a human to look at. They have no pass/fail to
#     gate on.
#
# Everything else is simply unverified. Adding an unverified harness to a gate is how a workflow
# starts failing for reasons nobody owns — so they go in one at a time, after a green run, with the
# timing noted above.
name: harness

on:
  schedule:
    # 03:00 UTC — late enough that a day's pushes are all in.
    - cron: '0 3 * * *'
  workflow_dispatch:
  # TEMPORARY, and removed in the commit after the run it is here to produce.
  # `arena` and `arena4` have never executed on a runner. They are being added on the strength of
  # laptop measurements, and this file's own rule is that a harness goes in after a green run —
  # so it needs one, on the machine that will be running it nightly. `workflow_dispatch` is the
  # intended way to get that and returns 403 for this token, so this is the way left.
  push:
    branches: [claude/portfolio-reflections-blog-8hqnwh]

permissions:
  contents: read

jobs:
  fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # No browser download: `scratchpad/lib/fixture.mjs` drives the system Chrome, and the runner
      # image ships one. Checked in its own step so a missing browser fails here, by name, instead of
      # inside the first harness as a bare `exit 2`.
      - name: Find Chrome
        run: |
          set -euo pipefail
          for p in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$p" ]; then echo "CHROME_PATH=$p" >> "$GITHUB_ENV"; "$p" --version; exit 0; fi
          done
          echo "::error::No Chrome on the runner. fixture.mjs needs one; set CHROME_PATH."
          exit 1

      - run: npm run build

      - name: Serve dist/ on 4416
        run: |
          node scripts/serve-out.mjs &
          # Poll rather than sleep: a fixed wait is either too short on a slow runner or wasted
          # time on a fast one, and the harnesses fail confusingly against a server that is not up.
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://localhost:4416/ && { echo "up after ${i} tries"; exit 0; }
            sleep 0.5
          done
          echo "::error::dist/ never came up on 4416"
          exit 1

      - name: Run the fleet
        run: |
          set -uo pipefail
          # Every harness runs even after one fails. Stopping at the first would hide the rest, and
          # when several go red together *which* ones went red is the most useful fact available.
          failed=()
          echo "| harness | result | time |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          for h in art-sink gaze timeline-filter rail-spy card-check phone-audit first-run arena5 arena8 arena4 arena; do
            start=$(date +%s)
            if out=$(timeout 420 node "scratchpad/$h.mjs" 2>&1); then
              mark='✅'
            else
              mark='❌'; failed+=("$h")
            fi
            secs=$(( $(date +%s) - start ))
            line=$(echo "$out" | grep -oE '[0-9]+/[0-9]+ checks passed|All first-run checks passed' | tail -1)
            echo "| \`$h\` | $mark ${line:-no checks line} | ${secs}s |" >> "$GITHUB_STEP_SUMMARY"
            echo "── $h  $mark  ${line:-no checks line}  ${secs}s"
            # The full log only for the ones that failed — a green fleet is 400 lines of PASS.
            [ "$mark" = '❌' ] && echo "$out"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::${#failed[@]} harness(es) failed: ${failed[*]}"
            exit 1
          fi
          echo "all green"

      # The harnesses write PNGs as they go; on a failure those are the difference between "a check
      # went red" and being able to see what the page looked like when it did.
      - name: Keep the screenshots from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-screenshots
          path: |
            scratchpad/*.png
            scratchpad/audit/**
          if-no-files-found: ignore
          retention-days: 14
